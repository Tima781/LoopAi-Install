name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          touch app/.env
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug -x test -x lint -x verifyRoborazziDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LoopAi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopAi-APK
          path: LoopAi.apk
          if-no-files-found: warn

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        with:
          tag_name: latest-apk
          name: "LoopAi Android APK (Готовый файл)"
          body: |
            ### 🚀 LoopAi Android APK
            Готовый установочный APK-файл **LoopAi.apk**.
            
            **Инструкция по установке:**
            1. Скачайте файл **`LoopAi.apk`** ниже в блоке Assets.
            2. Откройте его на Android-устройстве и нажмите **«Установить»**.
            3. Никаких ZIP-архивов и распаковки не требуется!
          files: LoopAi.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
